# Production variant using Docker secrets instead of a flat .env file.
# Put each secret's value in ./secrets/<name>.txt (git-ignored) or use an
# external secret. The app reads them via the *_FILE convention in config.py.
#
# Run with:  docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d --build

services:
  app:
    environment:
      # point each variable at its mounted secret file
      - GROQ_API_KEY_FILE=/run/secrets/groq_api_key
      - GEMINI_API_KEY_FILE=/run/secrets/gemini_api_key
      - ADMIN_PASSWORD_HASH_FILE=/run/secrets/admin_password_hash
      # SSO (optional)
      - AUTH_CLIENT_ID_FILE=/run/secrets/auth_client_id
      - AUTH_CLIENT_SECRET_FILE=/run/secrets/auth_client_secret
      - AUTH_COOKIE_SECRET_FILE=/run/secrets/auth_cookie_secret
      - AUTH_REDIRECT_URI=${AUTH_REDIRECT_URI:-}
      - AUTH_SERVER_METADATA_URL=${AUTH_SERVER_METADATA_URL:-}
      - AUTH_ALLOWED_DOMAIN=${AUTH_ALLOWED_DOMAIN:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
    secrets:
      - groq_api_key
      - gemini_api_key
      - admin_password_hash
      - auth_client_id
      - auth_client_secret
      - auth_cookie_secret

secrets:
  groq_api_key:
    file: ./secrets/groq_api_key.txt
  gemini_api_key:
    file: ./secrets/gemini_api_key.txt
  admin_password_hash:
    file: ./secrets/admin_password_hash.txt
  auth_client_id:
    file: ./secrets/auth_client_id.txt
  auth_client_secret:
    file: ./secrets/auth_client_secret.txt
  auth_cookie_secret:
    file: ./secrets/auth_cookie_secret.txt
